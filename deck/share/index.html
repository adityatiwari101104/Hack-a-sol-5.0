<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DocuHelp pitch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* VOICE quiet presenter view. IDEA a slide projector: one slide, nothing else. PICTURE the slide itself. COLOUR paper + ink blue (product palette). TYPE IBM Plex Sans. LAYOUT full-width slide stage, slim controls under it. */
:root{color-scheme:light dark;--bg:light-dark(#efece4,#0e1012);--ink:light-dark(#1b1e22,#ebe8e2);--ink2:light-dark(#5c6169,#a9a59d);--acc:light-dark(#1f3a5f,#9dbbe2);--card:light-dark(#fffefb,#181b1e);--line:light-dark(#d9d4c6,#2a2e33)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "IBM Plex Sans",system-ui,sans-serif;overflow-x:clip;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.stage{width:min(100%,calc((100vh - 76px) * 16 / 9));margin:0 auto;padding:12px max(1.5vw,10px) 0}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:8px;box-shadow:0 6px 30px #0003;background:var(--card)}
.track::-webkit-scrollbar{display:none}
.track img{flex:0 0 100%;width:100%;aspect-ratio:16/9;scroll-snap-align:center;display:block}
.bar{display:flex;align-items:center;justify-content:center;gap:14px;padding:12px 0 14px}
button{font:600 15px "IBM Plex Sans",sans-serif;color:var(--acc);background:var(--card);border:1px solid var(--line);border-radius:22px;min-width:44px;height:40px;padding:0 16px;cursor:pointer}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}button:disabled{opacity:.4;cursor:default}
.count{font-variant-numeric:tabular-nums;color:var(--ink2);min-width:64px;text-align:center}
.present{background:var(--acc);color:var(--card);border-color:var(--acc)}
body.show{background:#000}body.show .stage{width:min(100vw,calc(100vh * 16 / 9));padding:0}body.show .track{border-radius:0;box-shadow:none}
body.show .bar{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);opacity:0;transition:opacity .2s}body.show .bar:hover,body.show .bar:focus-within{opacity:1}
.track img{cursor:pointer}
</style></head><body>
<main class="stage" aria-label="DocuHelp pitch deck">
<div class="track" id="t" tabindex="0" aria-roledescription="carousel">
<img src="hi-1.png" alt="Slide 1: A bank can't act on an answer it can't prove. DocuHelp landing page and Withheld tray.">
<img src="hi-2.png" alt="Slide 2: Chatbots still cite rules that are no longer law.">
<img src="hi-3.png" alt="Slide 3: Each sentence ships with its proof, or it doesn't ship. AIML-02 coverage 6/6, bonus 3/3.">
<img src="hi-4.png" alt="Slide 4: Live: the date changes the law, and conflicts surface early.">
<img src="hi-5.png" alt="Slide 5: All three bonuses built, and more the brief didn't ask for.">
<img src="hi-6.png" alt="Slide 6: The AI only drafts. Code decides what you see. Full architecture.">
<img src="hi-7.png" alt="Slide 7: Same fresh questions: 85% right vs 50% for plain RAG.">
<img src="hi-8.png" alt="Slide 8: Others cite. We prove each quote was in force on your date.">
<img src="hi-9.png" alt="Slide 9: Proof, or silence. Plan and ask.">
</div>
<div class="bar"><button id="p" aria-label="Previous slide">←</button><span class="count" id="c" aria-live="polite">1 / 9</span><button id="n" aria-label="Next slide">→</button><button id="f" class="present" aria-label="Present full screen">Present ⛶</button></div>
</main>
<script>{
const t=document.getElementById('t'),imgs=[...t.querySelectorAll('img')],c=document.getElementById('c'),p=document.getElementById('p'),n=document.getElementById('n');
const cur=()=>Math.round(t.scrollLeft/t.clientWidth);
const go=i=>{i=Math.max(0,Math.min(imgs.length-1,i));t.scrollTo({left:i*t.clientWidth,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})};
const upd=()=>{const i=cur();c.textContent=(i+1)+' / '+imgs.length;p.disabled=i===0;n.disabled=i===imgs.length-1};
p.addEventListener('click',()=>go(cur()-1));n.addEventListener('click',()=>go(cur()+1));
t.addEventListener('scroll',()=>requestAnimationFrame(upd));
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(cur()+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur()-1)}if(e.key==='Home')go(0);if(e.key==='End')go(imgs.length-1)});
const f=document.getElementById('f');
const enter=async()=>{const i=cur();document.body.classList.add('show');f.textContent='Exit ✕';try{if(document.documentElement.requestFullscreen&&!document.fullscreenElement)await document.documentElement.requestFullscreen()}catch(e){}requestAnimationFrame(()=>t.scrollTo({left:i*t.clientWidth}))};
const exit=async()=>{const i=cur();document.body.classList.remove('show');f.textContent='Present ⛶';try{if(document.fullscreenElement)await document.exitFullscreen()}catch(e){}requestAnimationFrame(()=>t.scrollTo({left:i*t.clientWidth}))};
f.addEventListener('click',()=>document.body.classList.contains('show')?exit():enter());
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('show'))exit()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('show'))exit();if(e.key==='f'||e.key==='F')f.click()});
imgs.forEach(im=>im.addEventListener('click',e=>{go(cur()+(e.offsetX<im.clientWidth/3?-1:1))}));
window.addEventListener('resize',()=>{const i=Math.round(t.scrollLeft/t.clientWidth);t.scrollTo({left:i*t.clientWidth})});
upd();
}</script>
</body></html>
